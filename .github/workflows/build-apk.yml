name: Build BlackLogics APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Convert unsupported SVG Android resources to PNG
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/res -type f -name '*.svg' -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
            while IFS= read -r -d '' svg; do
              png="${svg%.svg}.png"
              echo "Converting $svg -> $png"
              rsvg-convert --format png --output "$png" "$svg"
              rm "$svg"
            done < <(find app/src/main/res -type f -name '*.svg' -print0)
          else
            echo "No SVG resources found."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackLogics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
