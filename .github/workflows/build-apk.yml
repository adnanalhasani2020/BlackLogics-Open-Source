name: Build BlackLogics APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Merge missing bundled Sketchware resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          libs = Path("app/libs")

          def resource_type(element):
              if element.tag == "item":
                  return element.attrib.get("type", "item")
              return element.tag

          def resource_key(element):
              name = element.attrib.get("name")
              return (resource_type(element), name) if name else None

          def valid_filename(path):
              name = path.name[:-6] if path.name.endswith(".9.png") else path.stem
              return bool(re.fullmatch(r"[a-z0-9_]+", name))

          # Track resources already supplied by the app, across all values XML files.
          known = set()
          for values_file in root.glob("values*/*.xml"):
              try:
                  tree = ET.parse(values_file)
                  for element in tree.getroot():
                      key = resource_key(element)
                      if key:
                          known.add(key)
              except ET.ParseError:
                  pass

          # Merge named values individually so existing app values win and duplicates
          # from bundled AAR extracts cannot break AAPT resource linking.
          for source_res in sorted(libs.rglob("res")):
              if not source_res.is_dir() or "AntiSplit" in source_res.parts:
                  continue
              for src in source_res.rglob("*"):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(source_res)
                  if rel.parts[0].startswith("values"):
                      if src.suffix != ".xml" or src.name in ("values.xml", "integers.xml"):
                          # Aggregate values files can contain stale/generated duplicates;
                          # named resources in other XML files are merged below instead.
                          if src.suffix != ".xml":
                              continue
                          if src.name in ("values.xml", "integers.xml"):
                              try:
                                  source_tree = ET.parse(src)
                              except ET.ParseError:
                                  continue
                          else:
                              continue
                      try:
                          source_tree = ET.parse(src)
                      except (ET.ParseError, UnboundLocalError):
                          continue
                      qualifier = rel.parts[0]
                      dest_dir = root / qualifier
                      dest_dir.mkdir(parents=True, exist_ok=True)
                      dest = dest_dir / "merged_bundled_resources.xml"
                      if dest.exists():
                          try:
                              dest_tree = ET.parse(dest)
                          except ET.ParseError:
                              dest_tree = ET.ElementTree(ET.Element("resources"))
                      else:
                          dest_tree = ET.ElementTree(ET.Element("resources"))
                      dest_root = dest_tree.getroot()
                      changed = False
                      for element in source_tree.getroot():
                          key = resource_key(element)
                          if not key or key in known:
                              continue
                          dest_root.append(element)
                          known.add(key)
                          changed = True
                      if changed:
                          dest_tree.write(dest, encoding="utf-8", xml_declaration=True)
                  else:
                      if not valid_filename(src) or src.name.startswith("dup_"):
                          continue
                      folder = rel.parts[0]
                      # Android treats -v4 as a compatibility alias for the base qualifier.
                      normalized_folder = folder[:-3] if folder.endswith("-v4") else folder
                      name = src.name[:-6] if src.name.endswith(".9.png") else src.stem
                      key = (normalized_folder, name)
                      existing = set()
                      for current in root.rglob("*"):
                          if current.is_file():
                              current_rel = current.relative_to(root)
                              current_folder = current_rel.parts[0]
                              current_folder = current_folder[:-3] if current_folder.endswith("-v4") else current_folder
                              current_name = current.name[:-6] if current.name.endswith(".9.png") else current.stem
                              existing.add((current_folder, current_name))
                      if key in existing:
                          continue
                      dest = root / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dest)
          print("Merged only missing named resources; ignored AntiSplit duplicate-ID resources.")
          PY

      - name: Convert unsupported SVG Android resources to PNG
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/res -type f -name '*.svg' -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
            while IFS= read -r -d '' svg; do
              png="${svg%.svg}.png"
              echo "Converting $svg -> $png"
              rsvg-convert --format png --output "$png" "$svg"
              rm "$svg"
            done < <(find app/src/main/res -type f -name '*.svg' -print0)
          else
            echo "No SVG resources found."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackLogics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
