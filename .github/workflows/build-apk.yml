name: Build BlackLogics APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Merge missing bundled Sketchware resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          packs = sorted(Path("app/libs").rglob("res"))

          def valid_resource_filename(path):
              name = path.name[:-6] if path.name.endswith(".9.png") else path.stem
              return bool(re.fullmatch(r"[a-z0-9_]+", name))

          def resource_key(rel):
              folder = rel.parts[0]
              if folder.endswith("-v4"):
                  folder = folder[:-3]
              filename = rel.name[:-6] if rel.name.endswith(".9.png") else rel.stem
              return (folder, filename)

          existing_files = set()
          for current in root.rglob("*"):
              if current.is_file() and not current.relative_to(root).parts[0].startswith("values"):
                  existing_files.add(resource_key(current.relative_to(root)))

          # Copy only valid, missing file-based resources; app resources win.
          for pack in packs:
              if not pack.is_dir() or pack == root:
                  continue
              for src in pack.rglob("*"):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(pack)
                  # These generated aggregate files duplicate AndroidX dependency attrs.
                  if rel.name == "values.xml":
                      continue
                  if rel.parts[0].startswith("values"):
                      dest = root / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      if not dest.exists():
                          try:
                              ET.parse(src)
                              shutil.copy2(src, dest)
                          except ET.ParseError:
                              pass
                          continue
                      if src.suffix != ".xml" or dest.suffix != ".xml":
                          continue
                      try:
                          source_tree = ET.parse(src)
                          dest_tree = ET.parse(dest)
                          source_root = source_tree.getroot()
                          dest_root = dest_tree.getroot()
                          existing = {((e.attrib.get("type") if e.tag == "item" else e.tag), e.attrib.get("name")) for e in dest_root if e.attrib.get("name")}
                          changed = False
                          for element in source_root:
                              name = element.attrib.get("name")
                              key = ((element.attrib.get("type") if element.tag == "item" else element.tag), name)
                              if name and key not in existing:
                                  dest_root.append(element)
                                  existing.add(key)
                                  changed = True
                          # Remove duplicates already present in destination values files.
                          seen = set()
                          for element in list(dest_root):
                              name = element.attrib.get("name")
                              key = ((element.attrib.get("type") if element.tag == "item" else element.tag), name)
                              if name and key in seen:
                                  dest_root.remove(element)
                                  changed = True
                              elif name:
                                  seen.add(key)
                          if changed:
                              dest_tree.write(dest, encoding="utf-8", xml_declaration=True)
                      except (ET.ParseError, OSError):
                          pass
                  else:
                      if not valid_resource_filename(src):
                          continue
                      key = resource_key(rel)
                      if key in existing_files:
                          continue
                      dest = root / rel
                      if not dest.exists():
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(src, dest)
                          existing_files.add(key)
          # Final pass: deduplicate every merged values XML file, including the app's originals.
          for dest in root.glob("values*/*.xml"):
              try:
                  tree = ET.parse(dest)
                  top = tree.getroot()
                  seen = set()
                  changed = False
                  for element in list(top):
                      name = element.attrib.get("name")
                      key = ((element.attrib.get("type") if element.tag == "item" else element.tag), name)
                      if name and key in seen:
                          top.remove(element)
                          changed = True
                      elif name:
                          seen.add(key)
                  if changed:
                      tree.write(dest, encoding="utf-8", xml_declaration=True)
              except (ET.ParseError, OSError):
                  pass
          print("Merged missing bundled resources, skipped invalid filenames, and removed duplicate values.")
          PY

      - name: Convert unsupported SVG Android resources to PNG
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/res -type f -name '*.svg' -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
            while IFS= read -r -d '' svg; do
              png="${svg%.svg}.png"
              echo "Converting $svg -> $png"
              rsvg-convert --format png --output "$png" "$svg"
              rm "$svg"
            done < <(find app/src/main/res -type f -name '*.svg' -print0)
          else
            echo "No SVG resources found."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackLogics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
